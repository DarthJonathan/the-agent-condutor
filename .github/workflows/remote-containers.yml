name: Remote container images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.github/workflows/remote-containers.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.github/workflows/remote-containers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-containers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-check:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conductor_test
          POSTGRES_USER: conductor_test
          POSTGRES_PASSWORD: conductor_ci_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U conductor_test -d conductor_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CONDUCTOR_TEST_DATABASE_URL: postgres://conductor_test:conductor_ci_test_password@127.0.0.1:5432/conductor_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test with PostgreSQL and the race detector
        run: go test -race -count=1 ./...
      - name: Vet backend
        run: go vet ./...
      - name: Validate pull-request image
        if: github.event_name == 'pull_request'
        run: docker build --tag conductor-backend:check .

  frontend-check:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Validate development and GHCR deployment configurations
        working-directory: .
        env:
          POSTGRES_PASSWORD: conductor_ci_test_password
          SESSION_SECRET: ci-only-session-secret-for-compose-validation-never-deploy
          PUBLIC_ORIGIN: https://conductor.example.test
        run: |
          docker compose -f docker-compose.yml config --quiet
          CONDUCTOR_IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}" CONDUCTOR_IMAGE_TAG="sha-${GITHUB_SHA}" \
            docker compose -f docker-compose.yml -f deploy/compose.ghcr.yml --profile https config --quiet
      - name: Validate pull-request image
        if: github.event_name == 'pull_request'
        run: docker build --tag conductor-frontend:check .

  publish:
    name: Publish ${{ matrix.component }}
    needs: [backend-check, frontend-check]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve image name
        id: image
        env:
          CONDUCTOR_COMPONENT: ${{ matrix.component }}
        run: printf 'name=ghcr.io/%s-%s\n' "${GITHUB_REPOSITORY,,}" "$CONDUCTOR_COMPONENT" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=conductor-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=conductor-${{ matrix.component }}
          provenance: mode=max
          sbom: true
      - name: Record published image
        env:
          CONDUCTOR_IMAGE: ${{ steps.image.outputs.name }}
          CONDUCTOR_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Published `%s@%s`\n' "$CONDUCTOR_IMAGE" "$CONDUCTOR_DIGEST" >> "$GITHUB_STEP_SUMMARY"
